
name: infra Terraform

on:
  workflow_dispatch:

# GitHub OIDC permissions
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.12.2"
  TF_WORKING_DIR: EKS-Terraform
  BUCKET_NAME: devncloudtechdevopsssanweshaa123

jobs:

  # ============================================================
  # TERRAFORM PLAN
  # ============================================================
  terraform-plan:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # DEBUG GITHUB OIDC CONTEXT
      # ==========================================================
      - name: Debug GitHub OIDC Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      # ==========================================================
      # AWS OIDC AUTHENTICATION
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::079059455177:role/GitHubActionsEcommerceRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # ==========================================================
      # TERRAFORM SETUP
      # ==========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Version
        run: terraform version

      # ==========================================================
      # CREATE S3 BACKEND BUCKET
      # ==========================================================
      - name: Create S3 Bucket if not exists
        run: |
          if aws s3api head-bucket --bucket "${BUCKET_NAME}" 2>/dev/null; then
            echo "S3 bucket already exists."
          else
            echo "Creating S3 bucket..."

            aws s3api create-bucket \
              --bucket "${BUCKET_NAME}" \
              --region "${AWS_REGION}"

            echo "S3 bucket created successfully."
          fi

      - name: Verify S3 Bucket
        run: |
          aws s3api head-bucket \
            --bucket "${BUCKET_NAME}"

          echo "S3 bucket verification successful."

      # ==========================================================
      # TERRAFORM INITIALIZATION
      # ==========================================================
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      # ==========================================================
      # UPLOAD TERRAFORM PLAN
      # ==========================================================
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: EKS-Terraform/tfplan
          retention-days: 1


  # ============================================================
  # TERRAFORM APPLY
  # ============================================================
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================================
      # DEBUG GITHUB OIDC CONTEXT
      # ==========================================================
      - name: Debug GitHub OIDC Context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"

      # ==========================================================
      # AWS OIDC AUTHENTICATION
      # ==========================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::079059455177:role/GitHubActionsEcommerceRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraform

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # ==========================================================
      # TERRAFORM SETUP
      # ==========================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ==========================================================
      # TERRAFORM INITIALIZATION
      # ==========================================================
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      # ==========================================================
      # DOWNLOAD TERRAFORM PLAN
      # ==========================================================
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: EKS-Terraform

      # ==========================================================
      # TERRAFORM APPLY
      # ==========================================================
      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      # ==========================================================
      # TERRAFORM OUTPUTS
      # ==========================================================
      - name: Terraform Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
